name: DNS Portal — Publish GitHub Pages

# Publishing is intentionally manual. A merged PR does not publish.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dns-portal-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portal
        run: npm run build
      - name: Upload built portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish Pages (approved manual run)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
