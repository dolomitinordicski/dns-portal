name: DNS Portal — GitHub Pages

# PR: compile and verify only. A merged PR triggers publication from main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dns-portal-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portal
        env:
          # Public DNS Core Firebase web-app identifiers, same names as Partner Hub.
          # Populate these repository secrets before releasing live widget data.
          VITE_DNS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_DNS_FIREBASE_PROJECT_ID }}
          VITE_DNS_FIREBASE_API_KEY: ${{ secrets.VITE_DNS_FIREBASE_API_KEY }}
          VITE_DNS_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_DNS_FIREBASE_AUTH_DOMAIN }}
          VITE_DNS_FIREBASE_APP_ID: ${{ secrets.VITE_DNS_FIREBASE_APP_ID }}
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
